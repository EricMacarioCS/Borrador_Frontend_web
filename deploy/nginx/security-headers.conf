# Se incluye en cada location porque add_header no se hereda cuando la location define los suyos.
# connect-src 'self' cubre el API y el hub de SignalR (wss) en el mismo dominio detrás de Kong.
# Si el API vive en otro dominio, agregarlo aquí (y a CORS en Kong).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HSTS lo agrega Kong, que es quien termina TLS.
