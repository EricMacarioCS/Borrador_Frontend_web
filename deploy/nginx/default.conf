# Sitio estático detrás de Kong. Kong enruta /api y /hubs al backend; todo lo demás llega aquí.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Sonda para el orquestador.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Archivos con huella en el nombre: se guardan un año.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Un archivo que ya no existe debe dar 404, no index.html: así la app detecta una versión nueva y recarga.
        try_files $uri =404;
    }

    # Configuración por ambiente y punto de entrada: siempre se revalidan.
    location = /config.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Si Kong no estuviera delante, las rutas del API no deben devolver la página.
    location ~ ^/(api|hubs)/ {
        return 404;
    }

    location ~* \.map$ {
        return 404;
    }

    # Rutas del historial (React Router): cualquier otra ruta sirve la aplicación.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
